kind = "web"
previewPath = "/"
title = "Chat App"
version = "1.0.0"
id = "artifacts/chat-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18228

[services.development]
run = "pnpm --filter @workspace/chat-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/chat-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/chat-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18228"
BASE_PATH = "/"
